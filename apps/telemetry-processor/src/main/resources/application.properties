spring.application.name=telemetry-processor
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/telemetrypulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

telemetry.mock.enabled=true
telemetry.mock.fixed-rate-ms=5000
telemetry.sse.heartbeat-ms=15000
