services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetrypulse
      POSTGRES_USER: telemetrypulse
      POSTGRES_PASSWORD: telemetrypulse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telemetrypulse -d telemetrypulse']
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-processor:
    build:
      context: ./apps/telemetry-processor
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telemetrypulse
      SPRING_DATASOURCE_USERNAME: telemetrypulse
      SPRING_DATASOURCE_PASSWORD: telemetrypulse
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TELEMETRY_MOCK_ENABLED: 'true'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  fleet-dashboard:
    build:
      context: .
      dockerfile: apps/fleet-dashboard/Dockerfile
    ports:
      - '4200:80'
    depends_on:
      - telemetry-processor

volumes:
  postgres-data:
